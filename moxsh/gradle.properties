org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.5.0 官方仅「测试到 compileSdk 34」，用 compileSdk 35 时会打印
# "We recommend using a newer Android Gradle plugin..." 告警。本项目 wrapper/AGP
# 版本被 CI 锁死（compileSdk 35 只用于对齐 targetSdk 35 的 16KB 合规），
# 用官方开关精确收口这条告警，避免刷屏/被当作错误，不掩盖任何真实兼容性问题。
android.suppressUnsupportedCompileSdk=35
