# moxsh Gradle Wrapper 配置
# 说明：gradle-wrapper.jar 无法在沙箱生成（二进制文件），CI 已用 gradle/actions/setup-gradle
# 直接安装 Gradle 构建，不受影响。本地开发者首次构建请执行一次：
#   gradle wrapper --gradle-version 8.7
# 即可在本目录生成 gradlew / gradlew.bat / gradle-wrapper.jar，之后 ./gradlew assembleRelease。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
