name: 💡 功能建议
description: 提出新功能或改进想法
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 感谢建议！描述清楚"想解决什么问题"比"怎么实现"更重要。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 目前什么场景下不方便？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它是什么样？
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 相关范围
      options:
        - 终端本身
        - 包管理 / 发行版
        - 插件 / .mox 包 / 商店
        - AI 助手
        - 界面
        - 文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: 确认
      options:
        - label: 我已搜索并确认没有重复的功能建议
          required: true
