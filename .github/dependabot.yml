version: 2
updates:
  # 2026-11-11 审计收口：此前 weekly + 无分组 + 无 major 过滤，
  # 一个月堆出 11 个 open PR，其中 9 个因「Dependabot 拿不到签名密钥」假失败。
  # 现在：minor/patch 合并成每组 1 个 PR；major 升级不自动开 PR（破坏性升级需人工评估）；
  # 频率降为 monthly，open 上限收紧。build.yml 已对无密钥 PR 改跑 assembleDebug。
  - package-ecosystem: "gradle"
    directory: "/moxsh"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 2026-11-11 审计补充：AGP 8.5 → 8.13 被判为 minor，但实测它连锁要求
      # Gradle 8.13+、Kotlin/Compose 配套；同组的 androidx.browser 1.10.0 /
      # androidx.core 1.19.1 又要求 compileSdk 36 / 37（本仓是 34）。
      # 这类「版本号是 minor、实质是 SDK 大版本迁移」的升级不该塞进分组 PR，
      # 否则每次都生成一个必挂红的巨型 PR（见已关闭的 #116）。
      # 由人工做独立迁移：统一 compileSdk / targetSdk、CI 装对应 platform、
      # 复核所有模块编译通过后再解除这里的 ignore。
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.library"
      - dependency-name: "com.android.tools.build:gradle"
      # 2026-11-11 二修：第一版写成裸包名 "androidx.core" / "androidx.browser"，
      # 实测没挡住 #118 —— Gradle 依赖在 Dependabot 里的名字是完整的
      # 「group:artifact」坐标（androidx.core:core-ktx、androidx.browser:browser），
      # 裸包名根本匹配不上。改用 group:* 通配覆盖该 group 下所有 artifact。
      - dependency-name: "androidx.core:*"
      - dependency-name: "androidx.browser:*"
      # 2026-11-11 三修（PR #119 五轮真实 CI 逐层定位）：另一批「minor/patch」
      # 库已经改用 Kotlin 2.x 编译，metadata 超出 Kotlin 1.9.x 编译器的
      # 可读上限 2.0.0，构建会报几十个「Unresolved reference: listOf /
      # runCatching / withContext」，看着像业务代码全错，实质是标准库
      # classpath 被 incompatible classes 污染：
      #   run 42987971371：coroutines 1.11.0 / kotlin-stdlib 2.2.20 → metadata 2.2.0
      #   run 42988921137：annotation 1.11.0 / kotlin-stdlib 2.1.20 → metadata 2.1.0
      # 这是 Kotlin 1.9.x → 2.x 工具链迁移（Compose Compiler Gradle Plugin /
      # AGP / compileSdk 连锁变更），必须人工独立做，不能塞进自动分组 PR。
      - dependency-name: "org.jetbrains.kotlinx:*"
      - dependency-name: "androidx.annotation:*"
      # Gradle 发行版大跳（8.7 → 8.14.6）与 AGP 8.5.0 / KGP 1.9.x 的组合
      # 未单独验证，排除掉以免分组 PR 里混进无法归因的变量。
      - dependency-name: "gradle"
      - dependency-name: "gradle-wrapper"

  - package-ecosystem: "cargo"
    directory: "/moxsh/terminal-core"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["dependencies", "ci"]
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

    ignore:
      # actions 大版本升级会连带改 runner 镜像、Node/Python 默认版本与
      # 权限模型，必须由人工跑一遍完整 CI 再决定，不收自动 PR。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]