name: 发布 APK 到 Release

# 把指定构建 run 的 APK 产物上传到目标 Release（手动触发）。
# 输入：构建 run id、目标 Release tag。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build moxsh APK 的 run id（artifact 所在 run）'
        required: true
        type: string
      tag:
        description: '目标 Release tag（需已存在）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: moxsh-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 下载产物可能保留构建时的目录层级，递归查找 APK。
          mapfile -t apks < <(find . -type f -name '*.apk' -not -path './.git/*')
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::构建产物里没有 APK，拒绝空上传"
            exit 1
          fi
          uploaded=0
          for src in "${apks[@]}"; do
            f=$(basename "$src")
            cp "$src" "/tmp/$f"
            gh release delete-asset "${{ inputs.tag }}" "$f" --yes 2>/dev/null || true
            gh release upload "${{ inputs.tag }}" "/tmp/$f" --clobber || exit 1
            uploaded=$((uploaded+1))
          done
          echo "已上传 $uploaded 个 APK"
          gh release view "${{ inputs.tag }}" --json assets --jq '.assets[] | {name, size, state}'
