name: 镜像到 Gitee（单向，GitHub 为唯一主源）
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'   # 每 6 小时兜底，防 push 触发的同步失败漏同步
  workflow_dispatch:        # 允许手动触发补同步

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 全量历史，标签也要同步

      # Gitee hook 会拒绝 users.noreply.github.com 这类隐藏邮箱：
      #   Push will publish a hidden email, make email public or abandon related commits
      # 只重写这份临时的镜像工作副本，GitHub 主仓历史与 commit sha 完全不动。
      # 重写后 sha 会与 GitHub 不同，这是单向镜像的预期代价。
      - name: 镜像副本替换隐藏邮箱（不动 GitHub 主仓）
        run: |
          git filter-branch -f --env-filter '
            if printf "%s" "$GIT_AUTHOR_EMAIL" | grep -qi "users.noreply.github.com"; then
              export GIT_AUTHOR_NAME="github-actions[bot]"
              export GIT_AUTHOR_EMAIL="github-actions-bot@codecloud.dev"
            fi
            if printf "%s" "$GIT_COMMITTER_EMAIL" | grep -qi "users.noreply.github.com"; then
              export GIT_COMMITTER_NAME="github-actions[bot]"
              export GIT_COMMITTER_EMAIL="github-actions-bot@codecloud.dev"
            fi
          ' --tag-name-filter cat -- --all >/tmp/mirror-filter-branch.log 2>&1
          # filter-branch 默认留 refs/original 备份；不删的话推送 refspec 会把旧对象也带过去
          for r in $(git for-each-ref --format='%(refname)' refs/original); do
            git update-ref -d "$r"
          done
          rm -rf .git/refs/original
          if git for-each-ref --format='%(refname)' | while read r; do git log "$r" --format='%ae %ce'; done | grep -qi 'users.noreply.github.com'; then
            echo "::error::镜像副本仍含隐藏邮箱，拒绝推送以免被 Gitee hook 拒绝"
            exit 1
          fi

      # ⚠️ 不用 --mirror：GitHub 的 refs/pull/* 会被 Gitee 当隐藏引用拒绝
      #    （deny updating a hidden ref），显式同步 heads+tags。
      # ⚠️ token 不走 remote URL（防日志泄露），走 http.extraheader。
      - name: 单向镜像到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: thousand-code-crafts/${{ github.event.repository.name }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::未配置 GITEE_TOKEN secret，跳过镜像（请在仓库 Settings → Secrets 配置）"
            exit 1
          fi
          git remote add gitee "https://gitee.com/${GITEE_REPO}.git"
          git config --local "http.https://gitee.com/.extraheader" \
            "Authorization: Basic $(printf 'thousand-code-crafts:%s' "$GITEE_TOKEN" | base64 -w0)"
          # Gitee 偶发连接超时（>300s），自动重试 3 次兜底
          for attempt in 1 2 3; do
            echo "::group::镜像尝试第 $attempt 次"
            if git push --prune gitee "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"; then
              echo "::endgroup::"
              echo "镜像完成：$(git rev-parse --short HEAD) → gitee.com/${GITEE_REPO}"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::镜像 3 次尝试均失败"
              exit 1
            fi
            echo "::warning::第 $attempt 次镜像失败，$((attempt * 30))s 后重试"
            sleep $((attempt * 30))
          done
