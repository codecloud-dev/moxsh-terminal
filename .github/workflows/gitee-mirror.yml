name: 镜像到 Gitee（单向，GitHub 为唯一主源）
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 镜像副本统一提交身份，保留机器人提交；仅同步分支与标签。
      - name: 统一镜像副本历史身份
        run: |
          python3 -m pip install --quiet git-filter-repo
          CANON_NAME="codecloud-dev"
          CANON_EMAIL="177202808+codecloud-dev@users.noreply.github.com"
          git log --all --format='%an|%ae' | sort -u | while IFS='|' read -r name email; do
            [ "$email" = "$CANON_EMAIL" ] && continue
            case "$email" in
              49699333+dependabot*) continue ;;
            esac
            printf '%s <%s> %s <%s>\n' "$CANON_NAME" "$CANON_EMAIL" "$name" "$email"
          done > /tmp/mirror-mailmap
          if [ -s /tmp/mirror-mailmap ]; then
            git filter-repo --force --mailmap /tmp/mirror-mailmap >/tmp/mirror-filter-repo.log 2>&1
          fi
          # 用 awk 避免空结果误判失败。
          BAD="$(git log --all --format='%an|%ae' | sort -u \
            | awk -v canon="codecloud-dev|$CANON_EMAIL" \
                  -v bot='dependabot[bot]|49699333+dependabot[bot]@users.noreply.github.com' \
                  '$0 != canon && $0 != bot')"
          if [ -n "$BAD" ]; then
            echo "::error::镜像副本仍含非统一身份，拒绝推送：$BAD"
            exit 1
          fi

      - name: 单向镜像到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: codecloud-dev/${{ github.event.repository.name }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::未配置镜像凭据 secret，跳过镜像"
            exit 1
          fi
          git remote add gitee "https://gitee.com/${GITEE_REPO}.git"
          git config --local "http.https://gitee.com/.extraheader" \
            "Authorization: Basic $(printf 'codecloud-dev:%s' "$GITEE_TOKEN" | base64 -w0)"
          # 有限重试；单次硬超时避免任务挂死。
          for attempt in 1 2 3; do
            echo "::group::镜像尝试第 $attempt 次"
            if timeout --signal=TERM --kill-after=30s 300s git push --prune gitee "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"; then
              echo "::endgroup::"
              echo "镜像完成：$(git rev-parse --short HEAD) → gitee.com/${GITEE_REPO}"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::镜像 3 次尝试均失败"
              exit 1
            fi
            echo "::warning::第 $attempt 次镜像失败，$((attempt * 30))s 后重试"
            sleep $((attempt * 30))
          done
