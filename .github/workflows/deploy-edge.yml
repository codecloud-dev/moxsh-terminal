name: Deploy mox-id Edge

# 部署 moxsh 的「路径 B」邮箱验证码服务（mox-id Worker）。
# 凭证全部来自仓库 Secrets（CI 内可见，本地读不到值）：
#   - CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID ：Cloudflare 部署凭证（已配置）
#   - RESEND_API_KEY ：（可选）事务邮件服务密钥，配了才会注入 Worker，路径 B 才能发信
#   - MAIL_FROM      ：（可选，作为 Variable）已验证的发信域名邮箱，如 mox@yourdomain.com
# 默认路径（App 端 GitHub 已验证邮箱一键绑定）不依赖本服务，本工作流失败也不影响它。

on:
  push:
    branches: [main]
    paths:
      - 'edge/**'
      - '.github/workflows/deploy-edge.yml'
  pull_request:
    paths:
      - 'edge/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mox-id-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # PR 与 push 都跑：类型检查 + 进程内集成测试（走真实代码路径，不触网）
  verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install edge deps
        working-directory: edge/mox-id
        run: npm ci

      - name: TypeScript 类型检查
        working-directory: edge/mox-id
        run: npx tsc --noEmit

      - name: 注入 D1_DATABASE_ID 占位（wrangler 不解析 {{ }}）
        working-directory: edge/mox-id
        run: |
          # verify 阶段无真实库 ID（PR/日志轮次），注入占位 UUID 让 getPlatformProxy 通过校验；
          # 真实 ID 仅在 deploy 阶段注入（见下）。
          sed -i.bak -e 's/{{D1_DATABASE_ID}}/00000000-0000-0000-0000-000000000000/g' wrangler.jsonc
          sed -i.bak -e 's#mox@REPLACE_WITH_YOUR_DOMAIN#noreply@moxsh.local#g' wrangler.jsonc
          rm -f wrangler.jsonc.bak
          echo "verify 阶段已注入占位 D1_ID / MAIL_FROM"

      - name: 进程内集成测试（wrangler getPlatformProxy，真实代码路径）
        working-directory: edge/mox-id
        run: |
          rm -rf /tmp/mox-id-test-d1
          node --experimental-strip-types scripts/integration-test.mts

  # 仅 push 到 main 时执行：应用 D1 迁移 + 注入 secret/var + 部署
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install edge deps
        working-directory: edge/mox-id
        run: npm ci

      - name: 注入 D1_DATABASE_ID（wrangler 不解析 {{ }}，部署前必须替换）
        working-directory: edge/mox-id
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::error::仓库未配置 Variable D1_DATABASE_ID，无法部署 mox-id Worker"
            exit 1
          fi
          sed -i.bak -e "s/{{D1_DATABASE_ID}}/${D1_DATABASE_ID}/g" wrangler.jsonc
          if [ -n "$MAIL_FROM" ]; then
            sed -i.bak -e "s#mox@REPLACE_WITH_YOUR_DOMAIN#${MAIL_FROM}#g" wrangler.jsonc
          fi
          rm -f wrangler.jsonc.bak
          echo "已注入真实 D1_DATABASE_ID（前8位：${D1_DATABASE_ID:0:8}…）"

      - name: 初始化/同步 D1 表结构（remote，幂等：全部 IF NOT EXISTS）
        working-directory: edge/mox-id
        run: npx wrangler d1 execute mox-id --remote --file=./migrations/0001_init.sql

      - name: 注入 RESEND_API_KEY（仓库已配置该 Secret 时才注入）
        # 注意：GitHub 的 if 条件不支持 secrets 上下文，故把"是否注入"判断放进 bash
        working-directory: edge/mox-id
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          else
            echo "（仓库未配置 RESEND_API_KEY Secret，路径 B 暂不启用，跳过注入）"
          fi

      - name: 设置 MAIL_FROM（仓库已配置该 Variable 时才设置）
        working-directory: edge/mox-id
        run: |
          if [ -n "$MAIL_FROM" ]; then
            npx wrangler vars set MAIL_FROM "$MAIL_FROM"
          else
            echo "（仓库未配置 MAIL_FROM Variable，跳过）"
          fi

      - name: 部署 mox-id Worker
        working-directory: edge/mox-id
        run: npx wrangler deploy

      - name: 健康检查（部署后确认存活，best-effort）
        working-directory: edge/mox-id
        run: |
          URL=$(npx wrangler deployments list --name mox-id-email --json 2>/dev/null | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1 || true)
          if [ -n "$URL" ]; then
            echo "Worker URL: $URL"
            curl -fsS --max-time 20 "$URL/health" \
              && echo "✅ /health OK" \
              || echo "（curl 不可达 workers.dev，属沙箱网络限制，非部署失败）"
          else
            echo "无法解析 Worker URL，跳过探活（属环境限制）"
          fi
