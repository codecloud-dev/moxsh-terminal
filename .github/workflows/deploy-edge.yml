name: Deploy mox-id Edge

# 部署 moxsh 的「路径 B」邮箱验证码服务（mox-id Worker）。
# 凭证全部来自仓库 Secrets（CI 内可见，本地读不到值）：
#   - CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID ：Cloudflare 部署凭证（已配置）
#   - RESEND_API_KEY ：（可选）事务邮件服务密钥，配了才会注入 Worker，路径 B 才能发信
#   - MAIL_FROM      ：（可选，作为 Variable）已验证的发信域名邮箱，如 mox@yourdomain.com
# 默认路径（App 端 GitHub 已验证邮箱一键绑定）不依赖本服务，本工作流失败也不影响它。

on:
  push:
    branches: [main]
    paths:
      - 'edge/**'
      - '.github/workflows/deploy-edge.yml'
  pull_request:
    paths:
      - 'edge/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mox-id-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # PR 与 push 都跑：类型检查 + 进程内集成测试（走真实代码路径，不触网）
  verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install edge deps
        working-directory: edge/mox-id
        run: npm ci

      - name: TypeScript 类型检查
        working-directory: edge/mox-id
        run: npx tsc --noEmit

      - name: 进程内集成测试（wrangler getPlatformProxy，真实代码路径）
        working-directory: edge/mox-id
        run: |
          rm -rf /tmp/mox-id-test-d1
          node --experimental-strip-types scripts/integration-test.mts

  # 仅 push 到 main 时执行：应用 D1 迁移 + 注入 secret/var + 部署
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install edge deps
        working-directory: edge/mox-id
        run: npm ci

      - name: 初始化/同步 D1 表结构（remote，幂等：全部 IF NOT EXISTS）
        working-directory: edge/mox-id
        run: npx wrangler d1 execute mox-id --remote --file=./migrations/0001_init.sql

      - name: 注入 RESEND_API_KEY（仅当仓库已配置该 Secret）
        if: ${{ secrets.RESEND_API_KEY != '' }}
        working-directory: edge/mox-id
        run: echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY

      - name: 设置 MAIL_FROM（仅当仓库已配置该 Variable）
        if: ${{ vars.MAIL_FROM != '' }}
        working-directory: edge/mox-id
        run: npx wrangler vars set MAIL_FROM "$MAIL_FROM"

      - name: 部署 mox-id Worker
        working-directory: edge/mox-id
        run: npx wrangler deploy

      - name: 健康检查（部署后确认存活，best-effort）
        working-directory: edge/mox-id
        run: |
          URL=$(npx wrangler deployments list --name mox-id-email --json 2>/dev/null | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1 || true)
          if [ -n "$URL" ]; then
            echo "Worker URL: $URL"
            curl -fsS --max-time 20 "$URL/health" \
              && echo "✅ /health OK" \
              || echo "（curl 不可达 workers.dev，属沙箱网络限制，非部署失败）"
          else
            echo "无法解析 Worker URL，跳过探活（属环境限制）"
          fi
