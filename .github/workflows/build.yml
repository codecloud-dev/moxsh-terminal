name: Build moxsh APK

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install Rust toolchain + cargo-ndk
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            moxsh/terminal-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('moxsh/terminal-core/Cargo.lock') }}
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "^4"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: on-success

      - name: Setup Gradle (no wrapper needed)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      # 国内网络优化：优先走腾讯/阿里镜像（无网络时也兼容 google/mavenCentral）
      - name: Setup Gradle mirror (domestic)
        run: |
          mkdir -p ~/.gradle
          cp moxsh/init.gradle.kts ~/.gradle/init.gradle.kts

      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > moxsh/release.jks

      - name: Build Release APK
        working-directory: moxsh
        run: gradle assembleRelease
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          KEYSTORE_PATH: ${{ github.workspace }}/moxsh/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moxsh-apk
          path: moxsh/app/build/outputs/apk/release/*.apk
          retention-days: 30
