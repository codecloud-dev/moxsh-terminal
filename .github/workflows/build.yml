name: Build moxsh APK

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
  pull_request:

# 允许诊断步骤写 summary；允许构建成功后直接把本地 APK 上传到 Release
permissions:
  issues: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      # 在编译前拦截"肉眼看不出、只有编译器才炸"的词法问题：
      # 注释文本里写了 "/*" 会被 Kotlin 当作嵌套注释起始符，整段吞掉后续代码，
      # 最终只在 EOF 报 "Unclosed comment" + 一堆 "Unresolved reference"，极难定位。
      # 早失败、早定位，比等 5 分钟 Gradle 编译强。
      - name: Kotlin 源码静态自检
        run: python3 .github/scripts/check_kotlin_lexer.py moxsh

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # GitHub 托管 runner 已预装完整 Android SDK（含 cmdline-tools 与构建工具），
      # 无需 android-actions/setup-android —— 该 Action 在新版 cmdline-tools 上
      # 会因安装过时包名 "tools" 而失败（sdkmanager exit 1）。

      - name: Install NDK 26.1.10909125
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          if [ ! -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            yes | "$SDKMANAGER" "ndk;26.1.10909125" > /dev/null
          else
            echo "NDK 26.1.10909125 已预装，跳过安装"
          fi

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install Rust toolchain + cargo-ndk
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            moxsh/terminal-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('moxsh/terminal-core/Cargo.lock') }}
      - name: Install cargo-ndk
        run: |
          if command -v cargo-ndk >/dev/null 2>&1; then
            echo "cargo-ndk 已存在，跳过安装"
          else
            cargo install cargo-ndk --version "^4" --locked
          fi

      - name: Setup Gradle 8.9 (含缓存)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-cleanup: on-success

      # 国内网络优化：优先走腾讯/阿里镜像（无网络时也兼容 google/mavenCentral）
      - name: Setup Gradle mirror (domestic)
        run: |
          mkdir -p ~/.gradle
          cp moxsh/init.gradle.kts ~/.gradle/init.gradle.kts

      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > moxsh/release.jks

      # Rust/NDK/cargo 交叉编译链偶发网络超时（crates.io / maven 抖动）会直接打挂整个构建。
      # 这里加重试：最多 3 次，每次把完整日志 tee 到 /tmp/build.log，最后失败时诊断步骤直接读该文件，
      # 不必再 clean 全量重编译（既慢又可能再次撞网络）。
      - name: Build Release APK (with retry)
        id: build
        working-directory: moxsh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          KEYSTORE_PATH: ${{ github.workspace }}/moxsh/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          n=0
          max=3
          until [ "$n" -ge "$max" ]; do
            n=$((n+1))
            echo "=== Build attempt $n/$max ==="
            # clean 打破增量编译缓存（避免复用坏文件时期的依赖图/产物导致误报）
            gradle clean assembleRelease --stacktrace 2>&1 | tee /tmp/build.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              echo "BUILD_OK=1" >> "$GITHUB_OUTPUT"
              echo "构建成功（第 $n 次尝试）"
              exit 0
            fi
            echo "第 $n 次尝试失败（rc=$rc），20s 后重试…"
            sleep 20
          done
          echo "BUILD_OK=0" >> "$GITHUB_OUTPUT"
          echo "3 次重试后仍失败"
          exit 1

      # 诊断：仅在 3 次重试全部失败后才触发。直接读 /tmp/build.log（已落盘），
      # 抓尾部并过滤噪音行（PREFER_SETTINGS 警告 / UP-TO-DATE / NO-SOURCE），
      # 把真实报错建为一个 GitHub Issue（沙箱无法下载日志 zip / 读 step summary API，
      # 但 issue 可经 gh api 可靠读取），用于定位是网络抖动还是真实代码/配置错误。
      - name: 诊断构建错误（建 issue 暴露）
        if: failure()
        working-directory: moxsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # 抓尾部 60KB，先过滤掉噪音行：
          #  - PREFER_SETTINGS 的仓库警告（每个子工程刷一遍）
          #  - "UP-TO-DATE" / "NO-SOURCE"（海量任务状态行，会把真正失败原因挤到更后面）
          # 过滤后尾部即可露出真正失败的任务与报错。
          SUMMARY=$(grep -v -e "prefer settings repositories over project repositories" \
                            -e "UP-TO-DATE" -e "NO-SOURCE" /tmp/build.log 2>/dev/null \
                            | tail -c 60000 || echo "（/tmp/build.log 不存在）")
          {
            echo '```'
            echo "$SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          SHA7=$(echo '${{ github.sha }}' | cut -c1-7)
          printf 'CI 构建失败（3 次重试均失败） @ %s\n\nrun: %s\n\n最后错误：\n\n```\n%s\n```\n' \
            "$SHA7" "${{ github.run_id }}" "$SUMMARY" \
            > /tmp/diag.md
          # 建 issue（可见性好；仓库无 ci 标签，故不带 --label）
          gh issue create \
            --title "CI 构建失败 $SHA7 · run ${{ github.run_id }}" \
            --body-file /tmp/diag.md 2>&1 | head -3 || echo "issue 创建失败（不影响主流程）"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moxsh-apk
          path: moxsh/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 构建成功后直接用本地 APK 文件发布到 v0.6.0（不走 artifact 下载，沙箱/runner 均无法下载 artifacts）
      # 仅依赖 Build 是否成功，与 Upload APK 步骤结果解耦（artifact 上传抖动不应阻断发布）。
      - name: 发布到 v0.6.0 Release
        if: steps.build.outcome == 'success'
        working-directory: moxsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 首次构建时创建 v0.6.0 Release（含 tag），已存在则忽略
          gh release create v0.6.0 \
            --title "v0.6.0 · 云同步与玻璃增强" \
            --notes "moxsh v0.6.0：PTY 内核强化 + 液态玻璃增强 + 命令云同步 MVP + 登录入口接线。详见 CHANGELOG.md" \
            --latest 2>/dev/null || true
          for f in app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            gh release delete-asset v0.6.0 "$(basename "$f")" --yes 2>/dev/null || true
            gh release upload v0.6.0 "$f"
          done
          gh release view v0.6.0 --json assets --jq '.assets[] | {name, size, state}'
