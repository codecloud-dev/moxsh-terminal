name: Build moxsh APK

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
  pull_request:

# 允许诊断步骤写 summary；允许构建成功后直接把本地 APK 上传到 Release
permissions:
  issues: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      # 在编译前拦截"肉眼看不出、只有编译器才炸"的词法问题：
      # 注释文本里写了 "/*" 会被 Kotlin 当作嵌套注释起始符，整段吞掉后续代码，
      # 最终只在 EOF 报 "Unclosed comment" + 一堆 "Unresolved reference"，极难定位。
      # 早失败、早定位，比等 5 分钟 Gradle 编译强。
      - name: Kotlin 源码静态自检
        run: python3 .github/scripts/check_kotlin_lexer.py moxsh

      # 防回归（真实事故）：曾声明 com.termux.permission.RUN_COMMAND 兼容 Termux，
      # 与已装 Termux 的同名权限定义冲突 → INSTALL_FAILED_DUPLICATE_PERMISSION，
      # 用户实测"与 termux 权限冲突无法安装"。禁止再抢注任何外部权限名。
      - name: AndroidManifest 权限声明自检
        run: python3 .github/scripts/check_manifest_permissions.py moxsh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub 托管 runner 已预装完整 Android SDK（含 cmdline-tools 与构建工具），
      # 无需 android-actions/setup-android —— 该 Action 在新版 cmdline-tools 上
      # 会因安装过时包名 "tools" 而失败（sdkmanager exit 1）。

      - name: Install NDK 26.1.10909125 (with retry)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            echo "NDK 26.1.10909125 已预装，跳过安装"
          else
            # sdkmanager 从 dl.google.com 拉 NDK zip 偶发断流/坏包
            # （Error reading Zip content from a SeekableByteChannel → exit 1）。
            # 重试 5 次，每次清掉半成品下载目录，避免坏包被复用。
            ok=0
            for i in 1 2 3 4 5; do
              echo "=== NDK 安装尝试 $i/5 ==="
              rm -rf "$ANDROID_HOME/.download" "$ANDROID_HOME/ndk/26.1.10909125" 2>/dev/null || true
              if yes | "$SDKMANAGER" "ndk;26.1.10909125" > /dev/null 2>&1 \
                 && [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
                echo "NDK 安装成功（第 $i 次）"; ok=1; break
              fi
              echo "第 $i 次失败，10s 后重试…"; sleep 10
            done
            [ "$ok" = 1 ] || { echo "NDK 26.1.10909125 安装失败（5 次尝试）"; exit 1; }
          fi

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install Rust toolchain + cargo-ndk
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            moxsh/terminal-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('moxsh/terminal-core/Cargo.lock') }}
      - name: Install cargo-ndk
        run: |
          if command -v cargo-ndk >/dev/null 2>&1; then
            echo "cargo-ndk 已存在，跳过安装"
          else
            cargo install cargo-ndk --version "^4" --locked
          fi

      # 2026-11-11 审计修复：旧配置把 Gradle 版本写死 8.9，绕过了仓库 wrapper。
      # Dependabot 升级 AGP（8.5.0 → 8.13.2）时已同步把 wrapper 提到 8.14.6，
      # 但 CI 仍用 8.9 → "Minimum supported Gradle version is 8.13"（#116 假失败）。
      # 现在从 wrapper 配置动态读取，AGP / Gradle 配套升级不会再被 CI 卡住。
      - name: 读取 Gradle Wrapper 版本
        id: gradle_version
        run: |
          VER=$(grep -oE 'gradle-[0-9]+(\.[0-9]+)*(-[a-z]+)?-bin\.zip' \
            moxsh/gradle/wrapper/gradle-wrapper.properties | head -1 | sed -E 's/^gradle-//; s/-bin\.zip$//')
          [ -n "$VER" ] || { echo "::error::无法从 gradle-wrapper.properties 解析 Gradle 版本"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Gradle 版本（来自 wrapper）: $VER"

      - name: Setup Gradle (跟随 wrapper，含缓存)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle_version.outputs.version }}
          cache-cleanup: on-success

      # 国内网络优化：优先走腾讯/阿里镜像（无网络时也兼容 google/mavenCentral）
      - name: Setup Gradle mirror (domestic)
        run: |
          mkdir -p ~/.gradle
          cp moxsh/init.gradle.kts ~/.gradle/init.gradle.kts

      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > moxsh/release.jks

      # 注入公开的 mox-id 服务地址，让发布的 APK 路径 B 能连上。
      # 服务地址使用中性自定义域 mox-id-email.moxsh.app（不绑定任何私人联系方式）。
      # 部署前请在 Cloudflare 把该自定义域（或你自有域子域）绑定到 mox-id-email Worker，
      # 否则请在 仓库 Settings → Variables 设 EMAIL_API_BASE 覆盖为实际可达地址。
      - name: 写入 local.properties（注入服务地址）
        working-directory: moxsh
        run: |
          {
            echo "email_api_base=${{ vars.EMAIL_API_BASE || 'https://mox-id-email.moxsh.app' }}"
          } > local.properties
          echo "email_api_base 已注入"

      # Rust/NDK/cargo 交叉编译链偶发网络超时（crates.io / maven 抖动）会直接打挂整个构建。
      # 这里加重试：最多 3 次，每次把完整日志 tee 到 /tmp/build.log，最后失败时诊断步骤直接读该文件，
      # 不必再 clean 全量重编译（既慢又可能再次撞网络）。
      - name: Build Release APK (with retry)
        id: build
        working-directory: moxsh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          KEYSTORE_PATH: ${{ github.workspace }}/moxsh/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # 商店验签密钥（P0 守卫：release 未注入即构建失败，禁止回退公开占位值）
          MOX_STORE_SECRET: ${{ secrets.MOX_STORE_SECRET }}
        run: |
          set +e
          # 2026-11-11 审计修复：Dependabot / fork PR 拿不到仓库 Secrets，
          # 旧流程必然在「release 未注入密钥」的 P0 守卫处失败 —— 这是假阴性，
          # 既刷了一堆「CI 构建失败」issue，也让 11 个依赖 PR 全挂红。
          # 无密钥时改跑 assembleDebug，只验证「依赖升级能否编译」，不做签名与发布。
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$MOX_STORE_SECRET" ]; then
            echo "::notice::无签名密钥（Dependabot / fork PR）：改跑 assembleDebug 编译验证，跳过 release 签名"
            gradle clean assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then echo "BUILD_OK=1" >> "$GITHUB_OUTPUT"; echo "DEBUG_BUILD_OK（依赖升级编译通过）"; exit 0; fi
            echo "DEBUG_BUILD_FAIL rc=$rc"; echo "BUILD_OK=0" >> "$GITHUB_OUTPUT"; exit 1
          fi
          n=0
          max=3
          until [ "$n" -ge "$max" ]; do
            n=$((n+1))
            echo "=== Build attempt $n/$max ==="
            # clean 打破增量编译缓存（避免复用坏文件时期的依赖图/产物导致误报）
            gradle clean assembleRelease --stacktrace 2>&1 | tee /tmp/build.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              echo "BUILD_OK=1" >> "$GITHUB_OUTPUT"
              echo "构建成功（第 $n 次尝试）"
              exit 0
            fi
            echo "第 $n 次尝试失败（rc=$rc），20s 后重试…"
            sleep 20
          done
          echo "BUILD_OK=0" >> "$GITHUB_OUTPUT"
          echo "3 次重试后仍失败"
          exit 1

      # 诊断：仅在 3 次重试全部失败后才触发。直接读 /tmp/build.log（已落盘），
      # 抓尾部并过滤噪音行（PREFER_SETTINGS 警告 / UP-TO-DATE / NO-SOURCE），
      # 把真实报错建为一个 GitHub Issue（沙箱无法下载日志 zip / 读 step summary API，
      # 但 issue 可经 gh api 可靠读取），用于定位是网络抖动还是真实代码/配置错误。
      - name: 诊断构建错误（建 issue 暴露）
        # PR（尤其 Dependabot）失败只在 PR 里看日志即可，不再开仓库级 issue 刷屏
        if: failure() && github.event_name != 'pull_request'
        working-directory: moxsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # 抓尾部 60KB，先过滤掉噪音行：
          #  - PREFER_SETTINGS 的仓库警告（每个子工程刷一遍）
          #  - "UP-TO-DATE" / "NO-SOURCE"（海量任务状态行，会把真正失败原因挤到更后面）
          # 过滤后尾部即可露出真正失败的任务与报错。
          SUMMARY=$(grep -v -e "prefer settings repositories over project repositories" \
                            -e "UP-TO-DATE" -e "NO-SOURCE" /tmp/build.log 2>/dev/null \
                            | tail -c 60000 || echo "（/tmp/build.log 不存在）")
          {
            echo '```'
            echo "$SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          SHA7=$(echo '${{ github.sha }}' | cut -c1-7)
          printf 'CI 构建失败（3 次重试均失败） @ %s\n\nrun: %s\n\n最后错误：\n\n```\n%s\n```\n' \
            "$SHA7" "${{ github.run_id }}" "$SUMMARY" \
            > /tmp/diag.md
          # 查重（2026-11-11 审计修复）：同类 open issue 只追加一条精简评论，
          # 不再每次失败都新建 issue（此前一个持续故障刷出 50+ 条重复告警）。
          NUM=$(gh issue list --state open --limit 50 --json number,title \
            -q '.[] | select(.title | test("CI 构建失败")) | .number' | head -1)
          if [ -n "$NUM" ]; then
            printf '⚠️ 同类失败再次发生：run `%s` · `%s` · %s\n\n详情见本次 Actions 日志（不重复贴大段日志，避免刷屏）。\n' \
              "${{ github.run_id }}" "${{ github.sha }}" "$(date -u +%FT%TZ)" > /tmp/recur.md
            gh issue comment "$NUM" --body-file /tmp/recur.md 2>&1 | head -2 || true
          else
            gh issue create \
              --title "CI 构建失败 $SHA7 · run ${{ github.run_id }}" \
              --body-file /tmp/diag.md 2>&1 | head -3 || echo "issue 创建失败（不影响主流程）"
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moxsh-apk
          # debug 构建（无密钥的 Dependabot PR）没有 release APK，找不到文件不应报警
          path: |
            moxsh/app/build/outputs/apk/release/*.apk
            moxsh/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 30

      # 2026-11-11 审计修复：旧流程把每次 push 的 APK 都覆盖到写死的 v0.6.2 tag，
      #   而 build.gradle 里的 versionName 早已是 1.0.0 —— 用户永远看不到版本迭代。
      #   改为 rolling tag `terminal-latest`（与 moxsh-proot 的 proot-latest 同思路）：
      #   历史语义化版本（含 v0.6.2）保留不动、不再被覆盖；版本号从 build.gradle 真实读取写进说明。
      #   仅依赖 Build 是否成功，与 Upload APK 步骤结果解耦（artifact 上传抖动不阻断发布）。
      - name: 发布到 terminal-latest Release
        if: steps.build.outcome == 'success' && github.event_name != 'pull_request' && env.KEYSTORE_BASE64 != ''
        working-directory: moxsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="terminal-latest"
          VER=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VER="${VER:-unknown}"
          SHA7=$(echo '${{ github.sha }}' | cut -c1-7)
          STAMP=$(date -u +%FT%TZ)
          echo "发布 rolling release：$TAG（代码版本 $VER @ $SHA7）"
          # 不存在则创建；已存在则刷新标题与说明（不改历史语义化 tag）
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "moxsh terminal · 滚动最新版" --notes "初始化" --latest || exit 1
          fi
          NOTES=$(printf 'moxsh-terminal 滚动构建（每次 push 到 main 自动刷新）。\n\n- 代码版本：`%s`\n- commit：`%s`\n- 构建时间：%s\n- 变更记录：见仓库 CHANGELOG.md 与 Releases 页面\n\n> 这是**滚动最新版**，不是语义化版本；需要固定版本请用带 `v` 前缀的历史 Release。' \
            "$VER" "$SHA7" "$STAMP")
          gh release edit "$TAG" --title "moxsh terminal $VER · 滚动最新版" --notes "$NOTES" || true
          for f in app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            gh release delete-asset "$TAG" "$(basename "$f")" --yes 2>/dev/null || true
            gh release upload "$TAG" "$f" --clobber
          done
          gh release view "$TAG" --json assets --jq '.assets[] | {name, size, state}'
