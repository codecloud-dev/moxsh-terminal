<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 760 380" width="760" height="380" role="img"
     aria-label="moxsh-terminal 手机终端动图：命令行安装 moxsh，进度条循环增长、光标闪烁">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1832"/>
      <stop offset="1" stop-color="#0d0b1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a7bff"/>
      <stop offset="1" stop-color="#37d5d3"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="760" height="380" fill="url(#bg)"/>
  <text x="380" y="34" text-anchor="middle" fill="#ECEAFF" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700">手机上的液态玻璃 Linux 终端</text>
  <text x="380" y="57" text-anchor="middle" fill="#9B96C9" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12">Rust 内核 · 自带完整命令行 · 像 iOS 一样顺滑</text>
  <rect x="270" y="78" width="220" height="252" rx="28" fill="#15122a" stroke="#8a7bff" stroke-width="2"/>
  <rect x="288" y="100" width="184" height="208" rx="12" fill="#0d0b1a"/>
  <text x="300" y="128" fill="#37d5d3" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700">$ </text>
  <text x="316" y="128" fill="#ECEAFF" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">pkg install moxsh</text>
  <rect x="430" y="118" width="8" height="14" fill="#fff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  <text x="300" y="156" fill="#9B96C9" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12">→ 解析依赖 12 个</text>
  <text x="300" y="178" fill="#9B96C9" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12">→ 解包 .mox 完成</text>
  <rect x="300" y="200" width="160" height="8" rx="4" fill="#2c2650"/>
  <rect x="300" y="200" width="0" height="8" rx="4" fill="url(#accent)"><animate attributeName="width" values="0;160;0" dur="3s" repeatCount="indefinite"/></rect>
  <circle cx="300" cy="232" r="4" fill="#37d5d3"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="312" y="236" fill="#6f6a96" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">Liquid Glass UI ready</text>
  <text x="380" y="352" text-anchor="middle" fill="#9B96C9" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12">装好即用 · 整个 App 从内核到界面都为「快」与「美」重造</text>
  <text x="380" y="366" text-anchor="middle" fill="#6f6a96" font-family="sans-serif" font-size="11">moxsh-terminal — 安卓上的液态玻璃 Linux 终端</text>
</svg>
